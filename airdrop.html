<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrop - Trần Thành Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
                <div class="brand-text">
                    <h2>TRẦN THÀNH</h2>
                    <span>COMMUNITY HUB</span>
                </div>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Trang chủ</span></a>
                <a href="airdrop.html" class="nav-item active"><i class="fa-solid fa-parachute-box"></i><span>Airdrop</span></a>
                <a href="tools.html" class="nav-item"><i class="fa-solid fa-shapes"></i><span>App & Extension</span></a>
                <a href="resources.html" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Tài nguyên</span></a>
                <a href="proxy.html" class="nav-item"><i class="fa-solid fa-network-wired"></i><span>Dịch vụ Proxy</span></a>
                <a href="license.html" class="nav-item"><i class="fa-solid fa-key"></i><span>License Script</span></a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <button class="mobile-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" 
                           id="searchInput" 
                           placeholder="Tìm kiếm nhanh kèo airdrop..." 
                           autocomplete="off" 
                           autocorrect="off" 
                           autocapitalize="off" 
                           spellcheck="false"
                           readonly 
                           onfocus="this.removeAttribute('readonly');"
                           oninput="render()">
                </div>
            </header>

            <div class="content-wrapper">
                <div class="page-title">
                    <div>
                        <h1>DANH SÁCH AIRDROP</h1>
                        <p>Cập nhật liên tục các kèo Airdrop & Retroactive tiềm năng</p>
                    </div>
                </div>

                <div class="filter-tabs" id="filterTabs">
                    <button class="tab-btn active" onclick="setCategory('ALL')">TẤT CẢ</button>
                    <button class="tab-btn" onclick="setCategory('TELEGRAM')">TELEGRAM BOT</button>
                    <button class="tab-btn" onclick="setCategory('TESTNET')">TESTNET</button>
                    <button class="tab-btn" onclick="setCategory('RETROACTIVE')">RETROACTIVE</button>
                    <button class="tab-btn" onclick="setCategory('NODE')">NODE</button>
                </div>

                <div id="loading" class="loading-state">
                    <i class="fa-solid fa-circle-notch fa-spin"></i>
                    <span>Đang tải danh sách kèo...</span>
                </div>

                <div class="cards-grid" id="airdropGrid"></div>

                <div id="noData" class="no-data" style="display: none;">
                    <i class="fa-solid fa-folder-open"></i>
                    <p>Không tìm thấy kèo nào phù hợp.</p>
                </div>

                <div class="pagination" id="pagination"></div>
            </div>
        </main>
    </div>

    <script>
        const SHEET_ID = '123h17u79sI1u4G2jW8m3W837w4B60i78w79Qj-69K6Q'; // Giữ nguyên ID Sheet của bạn
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGoogleData&gid=0`;

        let allAirdrops = [];
        let currentCategory = 'ALL';
        let currentPage = 1;
        const ITEMS_PER_PAGE = 12; // Đã đổi về 12 cho vừa vặn và đồng bộ

        function handleGoogleData(res) {
            document.getElementById('loading').style.display = 'none';
            if (!res || !res.table || !res.table.rows) {
                document.getElementById('noData').style.display = 'block';
                return;
            }

            const rows = res.table.rows;
            allAirdrops = rows.map(r => {
                const c = r.c || [];
                return {
                    id: c[0] ? (c[0].v ?? '') : '',
                    title: c[1] ? (c[1].v ?? '') : '',
                    category: c[2] ? (c[2].v ?? '') : '',
                    status: c[3] ? (c[3].v ?? '') : '',
                    desc: c[4] ? (c[4].v ?? '') : '',
                    link: c[5] ? (c[5].v ?? '') : '',
                    scriptLink: c[6] ? (c[6].v ?? '') : '',
                    guideProject: c[7] ? (c[7].v ?? '') : '',
                    guideScript: c[8] ? (c[8].v ?? '') : ''
                };
            }).filter(p => p.title && p.title.toLowerCase() !== 'title' && p.title.toLowerCase() !== 'tên kèo');

            render();
        }

        function setCategory(cat) {
            currentCategory = cat;
            currentPage = 1;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toUpperCase() === cat || (cat === 'ALL' && btn.innerText === 'TẤT CẢ'));
            });
            render();
        }

        function render() {
            const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();
            
            const filtered = allAirdrops.filter(item => {
                const matchCat = currentCategory === 'ALL' || item.category.toUpperCase().includes(currentCategory);
                const matchQuery = !query || 
                                   item.title.toLowerCase().includes(query) || 
                                   item.desc.toLowerCase().includes(query) ||
                                   item.category.toLowerCase().includes(query);
                return matchCat && matchQuery;
            });

            const grid = document.getElementById('airdropGrid');
            const noData = document.getElementById('noData');
            grid.innerHTML = '';

            if (filtered.length === 0) {
                noData.style.display = 'block';
                document.getElementById('pagination').innerHTML = '';
                return;
            }
            noData.style.display = 'none';

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = 1;

            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const pageData = filtered.slice(start, end);

            pageData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'hub-card';
                card.innerHTML = `
                    <div class="card-header">
                        <span class="badge ${item.status.toLowerCase().includes('end') ? 'badge-danger' : 'badge-success'}">${item.status || 'Active'}</span>
                        <span class="card-cat">${item.category || 'Airdrop'}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc || 'Không có mô tả chi tiết.'}</p>
                    </div>
                    <div class="card-actions">
                        ${item.link ? `<a href="${item.link}" target="_blank" class="btn btn-primary"><i class="fa-solid fa-arrow-up-right-from-square"></i> Tham gia</a>` : ''}
                        ${item.scriptLink ? `<a href="${item.scriptLink}" target="_blank" class="btn btn-secondary"><i class="fa-solid fa-code"></i> Script</a>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pag = document.getElementById('pagination');
            if (totalPages <= 1) {
                pag.innerHTML = '';
                return;
            }

            let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;
            
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    html += `<span class="page-dots">...</span>`;
                }
            }

            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;
            pag.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
    <script src="https://docs.google.com/spreadsheets/d/123h17u79sI1u4G2jW8m3W837w4B60i78w79Qj-69K6Q/gviz/tq?tqx=responseHandler:handleGoogleData&gid=0"></script>
</body>
</html>
