<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG ĐĂNG NHẬP & ĐĂNG KÝ</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pageBg: '#0f172a',
                        cardBg: '#ffffff',
                        primaryGreen: '#059669',
                        primaryBlue: '#2563eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 antialiased">

    <!-- Form Đăng Nhập -->
    <div id="loginBox" class="w-full max-w-md bg-white rounded-3xl p-8 shadow-2xl space-y-6">
        <div class="text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-3 shadow-inner">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900 uppercase tracking-tight">ĐĂNG NHẬP HỆ THỐNG</h2>
            <p class="text-xs text-slate-500 mt-1">Truy cập bảng điều khiển tài nguyên MMO Hub</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tài khoản đăng nhập</label>
                <input type="text" id="loginUser" placeholder="Nhập tài khoản" class="w-full h-11 px-4 rounded-xl border border-slate-200 text-sm focus:border-blue-600 outline-none transition bg-slate-50 focus:bg-white">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-bold text-slate-700 uppercase">Mật khẩu</label>
                    <button type="button" onclick="openForgotModal()" class="text-xs font-bold text-blue-600 hover:underline">Quên mật khẩu?</button>
                </div>
                <div class="relative">
                    <input type="password" id="loginPass" placeholder="••••••••" class="w-full h-11 px-4 pr-11 rounded-xl border border-slate-200 text-sm focus:border-blue-600 outline-none transition bg-slate-50 focus:bg-white">
                    <button type="button" onclick="togglePass('loginPass', 'eyeLogin')" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600">
                        <i id="eyeLogin" class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="loginMsg" class="text-xs font-bold text-rose-500 text-center hidden"></div>

            <button id="btnLogin" onclick="handleLogin()" class="w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider transition shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP
            </button>

            <div class="text-center pt-2">
                <span class="text-xs text-slate-500">Chưa có tài khoản?</span>
                <button onclick="openRegisterModal()" class="text-xs font-bold text-blue-600 hover:underline ml-1">Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <!-- Modal Đăng Ký -->
    <div id="registerModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-lg bg-white rounded-3xl p-6 sm:p-8 shadow-2xl relative space-y-4 max-h-[90vh] overflow-y-auto">
            <button onclick="closeRegisterModal()" class="absolute right-5 top-5 w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-center">
                <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2 shadow-inner">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-xl font-black text-slate-900 uppercase">ĐĂNG KÝ TÀI KHOẢN</h2>
            </div>

            <div id="regFormStep1" class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tài khoản đăng nhập *</label>
                    <input type="text" id="regUser" placeholder="tranthanh12193" class="w-full h-10 px-3.5 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mật khẩu *</label>
                        <div class="relative">
                            <input type="password" id="regPass" placeholder="••••••••" class="w-full h-10 px-3.5 pr-10 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                            <button type="button" onclick="togglePass('regPass', 'eyeReg1')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                                <i id="eyeReg1" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Xác nhận mật khẩu *</label>
                        <div class="relative">
                            <input type="password" id="regPassConfirm" placeholder="••••••••" class="w-full h-10 px-3.5 pr-10 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                            <button type="button" onclick="togglePass('regPassConfirm', 'eyeReg2')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                                <i id="eyeReg2" class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Gmail cá nhân *</label>
                        <input type="email" id="regEmail" placeholder="example@gmail.com" class="w-full h-10 px-3.5 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Xác nhận lại Gmail *</label>
                        <input type="email" id="regEmailConfirm" placeholder="example@gmail.com" class="w-full h-10 px-3.5 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Số điện thoại *</label>
                        <input type="text" id="regPhone" placeholder="0567275678" class="w-full h-10 px-3.5 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Username Telegram *</label>
                        <input type="text" id="regTele" placeholder="tranthanh1202" class="w-full h-10 px-3.5 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-emerald-600">
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="regAgree" class="w-4 h-4 text-emerald-600 rounded">
                    <label for="regAgree" class="text-xs text-slate-600 cursor-pointer">Tôi đồng ý với các điều khoản & chính sách thành viên</label>
                </div>

                <div id="regMsg" class="text-xs font-bold text-rose-500 text-center hidden"></div>

                <button id="btnSendOtp" onclick="handleSendOtp()" class="w-full h-11 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black uppercase tracking-wider transition shadow-lg shadow-emerald-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> ĐĂNG KÝ VÀ NHẬN OTP
                </button>
            </div>

            <!-- Bước nhập OTP Đăng ký -->
            <div id="regFormStep2" class="space-y-4 hidden">
                <div class="text-center p-3 bg-emerald-50 rounded-2xl border border-emerald-100">
                    <p class="text-xs text-emerald-800">Mã OTP đã gửi đến: <b id="otpTargetEmail"></b></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1 text-center">Nhập mã OTP 6 số</label>
                    <input type="text" id="inputOtp" maxlength="6" placeholder="123456" class="w-full h-12 text-center text-xl font-mono font-black tracking-widest rounded-xl border border-slate-200 outline-none focus:border-emerald-600 bg-slate-50 focus:bg-white">
                </div>

                <div id="otpMsg" class="text-xs font-bold text-rose-500 text-center hidden"></div>

                <button id="btnVerifyOtp" onclick="handleVerifyOtp()" class="w-full h-11 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black uppercase tracking-wider transition shadow-lg shadow-emerald-500/30">
                    XÁC THỰC & HOÀN TẤT
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Quên Mật Khẩu -->
    <div id="forgotModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-2xl relative space-y-4">
            <button onclick="closeForgotModal()" class="absolute right-5 top-5 w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:text-slate-700 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-center">
                <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-2xl mb-2 shadow-inner">
                    <i class="fa-solid fa-key"></i>
                </div>
                <h2 class="text-xl font-black text-slate-900 uppercase">QUÊN MẬT KHẨU</h2>
            </div>

            <!-- Bước 1: Nhập Gmail -->
            <div id="forgotStep1" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Gmail đăng ký tài khoản</label>
                    <input type="email" id="forgotEmail" placeholder="example@gmail.com" class="w-full h-11 px-4 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-600">
                </div>

                <div id="forgotMsg1" class="text-xs font-bold text-rose-500 text-center hidden"></div>

                <button id="btnForgotOtp" onclick="handleForgotSendOtp()" class="w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider transition shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> GỬI MÃ XÁC THỰC
                </button>
            </div>

            <!-- Bước 2: Nhập OTP & Đặt mật khẩu mới -->
            <div id="forgotStep2" class="space-y-3 hidden">
                <div class="text-center p-2.5 bg-blue-50 rounded-xl border border-blue-100">
                    <p class="text-xs text-blue-800">Mã xác thực đã gửi tới: <b id="forgotTargetEmail"></b></p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1 text-center">Mã OTP 6 số</label>
                    <input type="text" id="forgotOtpInput" maxlength="6" placeholder="123456" class="w-full h-11 text-center text-lg font-mono font-black tracking-widest rounded-xl border border-slate-200 outline-none focus:border-blue-600 bg-slate-50 focus:bg-white">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mật khẩu mới</label>
                    <div class="relative">
                        <input type="password" id="forgotNewPass" placeholder="••••••••" class="w-full h-10 px-3.5 pr-10 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-600">
                        <button type="button" onclick="togglePass('forgotNewPass', 'eyeForgot1')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                            <i id="eyeForgot1" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Xác nhận mật khẩu mới</label>
                    <div class="relative">
                        <input type="password" id="forgotNewPassConfirm" placeholder="••••••••" class="w-full h-10 px-3.5 pr-10 rounded-xl border border-slate-200 text-sm outline-none bg-slate-50 focus:bg-white focus:border-blue-600">
                        <button type="button" onclick="togglePass('forgotNewPassConfirm', 'eyeForgot2')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                            <i id="eyeForgot2" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div id="forgotMsg2" class="text-xs font-bold text-rose-500 text-center hidden"></div>

                <button id="btnResetPass" onclick="handleResetPass()" class="w-full h-11 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-black uppercase tracking-wider transition shadow-lg shadow-blue-500/30">
                    ĐẶT LẠI MẬT KHẨU
                </button>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnRpLqNiKsMJzMPTqsE6S637-G6J0hWne3Q3x-Vzt1OftH4Sa2WnvNqFqS8Vkmqv9zpw/exec';

        function togglePass(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa-regular fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa-regular fa-eye';
            }
        }

        function openRegisterModal() {
            document.getElementById('registerModal').classList.remove('hidden');
            document.getElementById('regFormStep1').classList.remove('hidden');
            document.getElementById('regFormStep2').classList.add('hidden');
            document.getElementById('regMsg').classList.add('hidden');
        }

        function closeRegisterModal() {
            document.getElementById('registerModal').classList.add('hidden');
        }

        function openForgotModal() {
            document.getElementById('forgotModal').classList.remove('hidden');
            document.getElementById('forgotStep1').classList.remove('hidden');
            document.getElementById('forgotStep2').classList.add('hidden');
            document.getElementById('forgotMsg1').classList.add('hidden');
        }

        function closeForgotModal() {
            document.getElementById('forgotModal').classList.add('hidden');
        }

        async function postGas(payload) {
            const res = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            return await res.json();
        }

        async function handleLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('btnLogin');

            if (!u || !p) {
                msg.innerText = "Vui lòng nhập tài khoản và mật khẩu!";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG ĐĂNG NHẬP...';
            msg.classList.add('hidden');

            try {
                const res = await postGas({ action: 'LOGIN', username: u, password: p });
                if (res.status === 'success') {
                    localStorage.setItem('hub_logged_username', res.username);
                    localStorage.setItem('hub_logged_email', res.email || '');
                    localStorage.setItem('hub_key_count', res.keyCount || 0);
                    window.location.href = "resources.html";
                } else {
                    msg.innerText = res.message || "Sai thông tin đăng nhập!";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối máy chủ!";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> ĐĂNG NHẬP';
            }
        }

        async function handleSendOtp() {
            const u = document.getElementById('regUser').value.trim();
            const p = document.getElementById('regPass').value.trim();
            const pc = document.getElementById('regPassConfirm').value.trim();
            const e = document.getElementById('regEmail').value.trim();
            const ec = document.getElementById('regEmailConfirm').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const tele = document.getElementById('regTele').value.trim();
            const agree = document.getElementById('regAgree').checked;
            const msg = document.getElementById('regMsg');
            const btn = document.getElementById('btnSendOtp');

            if (!u || !p || !pc || !e || !ec || !phone || !tele) {
                msg.innerText = "Vui lòng điền đầy đủ tất cả các trường!";
                msg.classList.remove('hidden');
                return;
            }
            if (p !== pc) {
                msg.innerText = "Mật khẩu xác nhận không khớp!";
                msg.classList.remove('hidden');
                return;
            }
            if (e !== ec) {
                msg.innerText = "Gmail xác nhận không khớp!";
                msg.classList.remove('hidden');
                return;
            }
            if (!agree) {
                msg.innerText = "Bạn phải đồng ý với điều khoản dịch vụ!";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG GỬI OTP...';
            msg.classList.add('hidden');

            try {
                const res = await postGas({
                    action: 'REGISTER',
                    username: u,
                    password: p,
                    email: e,
                    phone: phone,
                    telegram: tele
                });

                if (res.status === 'success') {
                    document.getElementById('otpTargetEmail').innerText = e;
                    document.getElementById('regFormStep1').classList.add('hidden');
                    document.getElementById('regFormStep2').classList.remove('hidden');
                } else {
                    msg.innerText = res.message || "Đăng ký thất bại!";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối máy chủ!";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ĐĂNG KÝ VÀ NHẬN OTP';
            }
        }

        async function handleVerifyOtp() {
            const e = document.getElementById('regEmail').value.trim();
            const otp = document.getElementById('inputOtp').value.trim();
            const msg = document.getElementById('otpMsg');
            const btn = document.getElementById('btnVerifyOtp');

            if (!otp || otp.length < 6) {
                msg.innerText = "Vui lòng nhập đủ 6 số OTP!";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XÁC THỰC...';
            msg.classList.add('hidden');

            try {
                const res = await postGas({
                    action: 'VERIFY_OTP_REGISTER',
                    email: e,
                    otp: otp
                });

                if (res.status === 'success') {
                    alert("🎉 Đăng ký tài khoản thành công! Bạn có thể đăng nhập ngay.");
                    closeRegisterModal();
                    document.getElementById('loginUser').value = document.getElementById('regUser').value;
                    document.getElementById('loginPass').value = document.getElementById('regPass').value;
                } else {
                    msg.innerText = res.message || "Xác thực OTP thất bại!";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối máy chủ!";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'XÁC THỰC & HOÀN TẤT';
            }
        }

        async function handleForgotSendOtp() {
            const e = document.getElementById('forgotEmail').value.trim();
            const msg = document.getElementById('forgotMsg1');
            const btn = document.getElementById('btnForgotOtp');

            if (!e) {
                msg.innerText = "Vui lòng nhập Gmail đăng ký!";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG GỬI MÃ...';
            msg.classList.add('hidden');

            try {
                const res = await postGas({
                    action: 'FORGOT_PASSWORD_SEND_OTP',
                    email: e
                });

                if (res.status === 'success') {
                    document.getElementById('forgotTargetEmail').innerText = e;
                    document.getElementById('forgotStep1').classList.add('hidden');
                    document.getElementById('forgotStep2').classList.remove('hidden');
                } else {
                    msg.innerText = res.message || "Gửi OTP thất bại!";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối máy chủ!";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> GỬI MÃ XÁC THỰC';
            }
        }

        async function handleResetPass() {
            const e = document.getElementById('forgotEmail').value.trim();
            const otp = document.getElementById('forgotOtpInput').value.trim();
            const p = document.getElementById('forgotNewPass').value.trim();
            const pc = document.getElementById('forgotNewPassConfirm').value.trim();
            const msg = document.getElementById('forgotMsg2');
            const btn = document.getElementById('btnResetPass');

            if (!otp || !p || !pc) {
                msg.innerText = "Vui lòng điền đủ mã OTP và mật khẩu mới!";
                msg.classList.remove('hidden');
                return;
            }
            if (p !== pc) {
                msg.innerText = "Mật khẩu xác nhận không khớp!";
                msg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> ĐANG CẬP NHẬT...';
            msg.classList.add('hidden');

            try {
                const res = await postGas({
                    action: 'FORGOT_PASSWORD_RESET',
                    email: e,
                    otp: otp,
                    newPassword: p
                });

                if (res.status === 'success') {
                    alert("🎉 Đặt lại mật khẩu thành công! Hãy đăng nhập bằng mật khẩu mới.");
                    closeForgotModal();
                    document.getElementById('loginPass').value = p;
                } else {
                    msg.innerText = res.message || "Cập nhật mật khẩu thất bại!";
                    msg.classList.remove('hidden');
                }
            } catch (err) {
                msg.innerText = "Lỗi kết nối máy chủ!";
                msg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ĐẶT LẠI MẬT KHẨU';
            }
        }
    </script>
</body>
</html>
