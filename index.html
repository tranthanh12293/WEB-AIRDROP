<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ AIRDROP & CRYPTO SCRIPTS HUB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pageBg: '#f8fafc',
                        cardBg: '#ffffff',
                        borderLight: '#e2e8f0',
                        primaryBlue: '#2563eb',
                        primaryHover: '#1d4ed8',
                        textMain: '#0f172a',
                        textMuted: '#64748b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pageBg text-textMain min-h-screen font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="border-b border-borderLight bg-white/90 backdrop-blur sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/20">
                    ⚡
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-wide">AIRDROP HUB & SCRIPTS</h1>
                    <p class="text-xs text-textMuted font-medium">Cập nhật kèo Airdrop & Tool chạy tự động</p>
                </div>
            </div>

            <!-- Thanh tìm kiếm -->
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Tìm tên kèo, danh mục..." 
                    class="w-full bg-slate-50 border border-borderLight rounded-lg pl-10 pr-4 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-primaryBlue focus:bg-white transition shadow-inner">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
        
        <!-- Filter Tabs -->
        <div class="flex flex-wrap items-center gap-2 mb-8" id="categoryTabs">
            <button class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold bg-primaryBlue text-white shadow-sm transition" data-cat="all">Tất cả</button>
        </div>

        <!-- Trạng thái Loading -->
        <div id="loader" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-primaryBlue mb-3"></i>
            <p class="text-textMuted text-sm font-medium">Đang đồng bộ dữ liệu từ Google Sheet...</p>
        </div>

        <!-- Grid Cards -->
        <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

        <!-- Không có kết quả -->
        <div id="noData" class="text-center py-16 hidden">
            <i class="fa-regular fa-folder-open text-4xl text-slate-400 mb-2"></i>
            <p class="text-textMuted text-sm">Không tìm thấy dự án nào phù hợp.</p>
        </div>
    </main>

    <footer class="border-t border-borderLight mt-20 py-6 text-center text-xs text-textMuted bg-white">
        © 2026 Airdrop & Scripts Portal. Dữ liệu tự động cập nhật từ Google Sheet.
    </footer>

    <!-- Logic JS (JSONP chống chặn CORS) -->
    <script>
        const SHEET_ID = '1f6xVa0Z03aEO4GKY64vDh8AOW-2FPzsX7acpa0ehTPw';
        let allProjects = [];
        let activeCategory = 'all';

        function handleGoogleData(response) {
            try {
                if (response.status === 'error') {
                    throw new Error(response.errors[0].message);
                }

                const rows = response.table.rows;
                allProjects = rows.map(r => {
                    const c = r.c;
                    return {
                        id: c[0] ? (c[0].v ?? '') : '',
                        title: c[1] ? (c[1].v ?? '') : '',
                        category: c[2] ? (c[2].v ?? 'General') : 'General',
                        status: c[3] ? (c[3].v ?? 'NEW') : 'NEW',
                        description: c[4] ? (c[4].v ?? '') : '',
                        ref_link: c[5] ? (c[5].v ?? '') : '',
                        script_link: c[6] ? (c[6].v ?? '') : '',
                        guide_link: c[7] ? (c[7].v ?? '') : ''
                    };
                }).filter(p => p.title && p.title.toString().toLowerCase() !== 'title');

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('projectGrid').classList.remove('hidden');

                buildCategoryTabs();
                renderProjects();
            } catch (err) {
                console.error("Lỗi:", err);
                document.getElementById('loader').innerHTML = `
                    <div class="text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-bold">Lỗi nạp dữ liệu từ Google Sheet!</p>
                        <p class="text-xs text-slate-500 mt-1">Kiểm tra lại quyền công khai trên Google Sheet.</p>
                    </div>
                `;
            }
        }

        function loadJSONP() {
            const script = document.createElement('script');
            script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleGoogleData&gid=0`;
            script.onerror = function() {
                document.getElementById('loader').innerHTML = `
                    <div class="text-red-500">
                        <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                        <p class="font-bold">Không thể kết nối đến Google Sheet!</p>
                    </div>
                `;
            };
            document.body.appendChild(script);
        }

        function buildCategoryTabs() {
            const categories = ['all', ...new Set(allProjects.map(p => p.category).filter(Boolean))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = categories.map(cat => `
                <button class="filter-btn px-4 py-2 rounded-lg text-sm font-semibold border transition shadow-sm ${cat === activeCategory ? 'bg-primaryBlue text-white border-primaryBlue shadow-blue-500/20' : 'bg-white text-slate-600 border-borderLight hover:bg-slate-50 hover:text-slate-900'}" 
                    data-cat="${cat}">
                    ${cat === 'all' ? 'Tất cả' : cat}
                </button>
            `).join('');

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    activeCategory = e.target.getAttribute('data-cat');
                    buildCategoryTabs();
                    renderProjects();
                });
            });
        }

        function renderProjects() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('projectGrid');
            const noData = document.getElementById('noData');

            const filtered = allProjects.filter(p => {
                const matchCat = activeCategory === 'all' || p.category === activeCategory;
                const matchSearch = p.title.toString().toLowerCase().includes(query) || 
                                    p.description.toString().toLowerCase().includes(query) ||
                                    p.category.toString().toLowerCase().includes(query);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noData.classList.remove('hidden');
                return;
            }

            noData.classList.add('hidden');
            grid.innerHTML = filtered.map(p => {
                const isHot = p.status.toString().toUpperCase() === 'HOT';
                const statusBadge = isHot 
                    ? 'bg-rose-50 text-rose-600 border-rose-200' 
                    : 'bg-emerald-50 text-emerald-600 border-emerald-200';

                return `
                <div class="bg-white border border-slate-200/80 rounded-2xl p-5 hover:border-blue-300 hover:shadow-lg transition-all duration-200 flex flex-col justify-between shadow-sm">
                    <div>
                        <!-- Header Card -->
                        <div class="flex items-start justify-between gap-3 mb-3">
                            <div>
                                <span class="text-xs px-2.5 py-1 rounded-md bg-slate-100 text-slate-600 font-semibold border border-slate-200/60">${p.category}</span>
                                <h3 class="text-lg font-bold text-slate-900 mt-2.5">${p.title}</h3>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-md font-bold border ${statusBadge}">
                                ${p.status}
                            </span>
                        </div>

                        <!-- Description -->
                        <p class="text-slate-600 text-xs line-clamp-3 mb-6 leading-relaxed">
                            ${p.description || 'Chưa có mô tả dự án.'}
                        </p>
                    </div>

                    <!-- Action Buttons -->
                    <div class="space-y-2 pt-4 border-t border-slate-100">
                        ${p.ref_link ? `
                            <a href="${p.ref_link}" target="_blank" class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center justify-center gap-2 transition shadow-sm shadow-blue-500/20">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Tham gia (Link Ref)
                            </a>
                        ` : ''}

                        <div class="grid grid-cols-2 gap-2">
                            ${p.script_link ? `
                                <a href="${p.script_link}" target="_blank" class="py-2.5 px-3 rounded-xl bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-700 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                                    <i class="fa-solid fa-code"></i> Tải Script
                                </a>
                            ` : '<div class="text-center py-2.5 text-xs text-slate-400 bg-slate-50 border border-slate-100 rounded-xl font-medium">No Script</div>'}

                            ${p.guide_link ? `
                                <a href="${p.guide_link}" target="_blank" class="py-2.5 px-3 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-700 text-xs font-bold flex items-center justify-center gap-1.5 transition">
                                    <i class="fa-solid fa-book-open"></i> Hướng dẫn
                                </a>
                            ` : '<div class="text-center py-2.5 text-xs text-slate-400 bg-slate-50 border border-slate-100 rounded-xl font-medium">No Guide</div>'}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        document.getElementById('searchInput').addEventListener('input', renderProjects);
        window.addEventListener('DOMContentLoaded', loadJSONP);
    </script>
</body>
</html>
